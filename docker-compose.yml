version: '3.8'

services:
  beatsync:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oidasheim-beatsync
    
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - OIDASHEIM_ROOT=/app
      - OIDASHEIM_MP3_ROOT=/data/music
      - OIDASHEIM_CLIP_POOL=/data/clips
    
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./output:/app/output
      - /data/music:/data/music:ro  # Read-only music input
      - /data/clips:/data/clips:ro   # Read-only clip pool
    
    ports:
      - "5000:5000"  # Flask API (optional)
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 16G
        reservations:
          cpus: '2'
          memory: 8G
    
    # Restart policy
    restart: on-failure
    
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: PostgreSQL for persistence (instead of SQLite)
  postgres:
    image: postgres:15-alpine
    container_name: oidasheim-postgres
    environment:
      POSTGRES_DB: beat_sync
      POSTGRES_USER: oidasheim
      POSTGRES_PASSWORD: ${DB_PASSWORD:-oidasheim_secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: on-failure
    profiles:
      - db

volumes:
  postgres_data:

networks:
  default:
    name: oidasheim-network
    driver: bridge
